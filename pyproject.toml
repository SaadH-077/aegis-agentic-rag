[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-assistant"
version = "0.1.0"
description = "Adaptive, self-correcting Agentic RAG assistant built with LangChain, LangGraph and LangSmith."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saad Haroon Jehangir" }]
keywords = ["langchain", "langgraph", "langsmith", "rag", "agents", "llm"]

dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-huggingface>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.4",
    "huggingface-hub>=0.26.0",
    "faiss-cpu>=1.8.0",
    "ddgs>=2.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.36",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]
local = ["sentence-transformers>=3.0"]
groq = ["langchain-groq>=0.2.0"]
ollama = ["langchain-ollama>=0.2.0"]

[project.urls]
Homepage = "https://github.com/your-username/agentic-rag-assistant"

[project.scripts]
agentic-rag-ingest = "agentic_rag.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------- Tooling config --------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "app", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# E501 (line length) is noisy for long prompt strings; the formatter handles code.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
